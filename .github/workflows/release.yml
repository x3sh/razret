name: Build and release Razret
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: razret-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, verify and package
        shell: pwsh
        run: ./release.ps1 -Repository '${{ github.repository }}'
      - name: Verify real downloads and installer on clean Windows
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ZapretApp/ZapretApp.csproj
          $version = $project.Project.PropertyGroup.Version
          dotnet build tests/UpdateIntegration/UpdateIntegration.csproj -c Release -o build/update-integration-check
          if ($LASTEXITCODE) { throw 'Integration build failed.' }
          dotnet build/update-integration-check/UpdateIntegration.dll "$PWD/research/ci-updates" --live
          if ($LASTEXITCODE) { throw 'Real update download checks failed.' }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe "/out:$PWD\build\update-integration-check\RestartFixture.exe" "$PWD\tests\UpdateIntegration\RestartFixture.cs.txt"
          if ($LASTEXITCODE) { throw 'Restart fixture build failed.' }
          dotnet build/update-integration-check/UpdateIntegration.dll "$PWD/research/ci-updates" --helper "$PWD/build/release-$version/Razret.exe" "$PWD/build/update-integration-check/RestartFixture.exe"
          if ($LASTEXITCODE) { throw 'Self-contained installer checks failed.' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          [xml]$project = Get-Content src/ZapretApp/ZapretApp.csproj
          $version = $project.Project.PropertyGroup.Version
          $tag = "v$version"
          if ($env:EVENT_REF.StartsWith('refs/tags/') -and $env:EVENT_REF -ne "refs/tags/$tag") { throw 'Tag does not match application version.' }
          gh release view $tag --repo $env:REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; increase the version first." }
          gh release create $tag "dist/Razret-$version-win-x64.zip" 'dist/Razret-app-update-win-x64.zip' --repo $env:REPOSITORY --target $env:COMMIT_SHA --title "Razret $version" --notes-file release-notes.md --latest
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
